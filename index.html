<style id="css-tokens">
/* Layout idea: instrument-panel tool. Tabs for input, tiles and charts for results, a paper-style report sheet. */
:root{
  --bg:#eef1f3; --surface:#fcfcfb; --soft:#e4eaed; --ink:#14212a; --muted:#56646e; --line:#d2d9de;
  --accent:#0b6177; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
</style>
<style id="css-report">
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.01em}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 3px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill i{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;line-height:1}
.pill.ok i{background:var(--good)} .pill.warn i{background:var(--warn);color:#3a2a00} .pill.bad i{background:var(--crit)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-left-width:4px;border-radius:4px;background:var(--surface);font-size:13.5px}
.alerts li.warn{border-left-color:var(--warn)} .alerts li.bad{border-left-color:var(--crit)} .alerts li.ok{border-left-color:var(--good)}
.chart{margin:0;min-width:0}

.chart .sub{color:var(--muted);font-size:12px;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--muted)}
.legend b.s1{border-color:var(--s1)} .legend b.s2{border-color:var(--s2)} .legend b.s3{border-color:var(--s3)}
.legend b.crit{border-color:var(--crit);border-top-style:dashed} .legend b.sn{border-color:var(--muted);border-top-style:dashed}
.legend b.band{height:9px;border:0;background:var(--s1);opacity:.22}
svg.plot{display:block;max-width:100%;height:auto;background:var(--surface);touch-action:pan-y}
svg.plot text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
svg.plot .grid{stroke:var(--line);stroke-width:1}
svg.plot .axis{stroke:var(--muted);stroke-width:1}
svg.plot .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.plot .s1{stroke:var(--s1)} svg.plot .s2{stroke:var(--s2)} svg.plot .s3{stroke:var(--s3)} svg.plot .sn{stroke:var(--muted)} svg.plot .crit{stroke:var(--crit)}
svg.plot .dash{stroke-dasharray:6 4}
svg.plot .bd{stroke:none;opacity:.16} svg.plot .bd.s1{fill:var(--s1)} svg.plot .bd.s2{fill:var(--s2)}
svg.plot .dot{stroke:var(--surface);stroke-width:2} svg.plot .dot.s1{fill:var(--s1)} svg.plot .dot.s2{fill:var(--s2)} svg.plot .dot.s3{fill:var(--s3)} svg.plot .dot.sn{fill:var(--muted)}
svg.plot .mk{fill:var(--ink);font-size:11px}
svg.plot .xh{stroke:var(--ink);stroke-width:1;opacity:.45;pointer-events:none}
/* report sheet */
.rp{background:var(--surface);color:var(--ink);border:1px solid var(--line);max-width:860px;margin:0 auto;padding:28px 30px}
.rp h1{font-size:26px} .rp h2{font-size:18px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)} .rp h3{font-size:15px;margin:16px 0 6px}
.rp .rhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:10px;flex-wrap:wrap}
.rp .rhead small{color:var(--muted);display:block;font-size:12px}
.rp .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px;margin:12px 0;font-size:13.5px}
.rp .meta div{display:flex;gap:8px;border-bottom:1px dotted var(--line);padding:3px 0} .rp .meta span{color:var(--muted);min-width:96px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:8px 0}
.kv>div{border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--surface);min-width:0}
.kv .lab{font-size:12px;color:var(--muted)} .kv .val{font-family:var(--font-num);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.kv .val small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px} .kv .more{font-size:12px;color:var(--muted)}
.rp figure{margin:14px 0;break-inside:avoid} .rp table{break-inside:auto} .rp tr{break-inside:avoid}
.rp th{white-space:normal;font-size:11.5px;vertical-align:bottom} .rp td{font-size:12.5px} .rp td.n{font-size:12px}
.rp .note{font-size:12.5px;color:var(--muted)} .rp ol,.rp ul{margin:6px 0;padding-left:20px;font-size:13.5px}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px;break-inside:avoid}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:12.5px} .sign b{display:block;min-height:1.3em}
.pb{break-before:page}
.srst{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left-width:6px;border-radius:4px;margin:10px 0;font-size:15px}
.srst.ok{border-left-color:var(--good)} .srst.warn{border-left-color:var(--warn)} .srst.bad{border-left-color:var(--crit)} .srst .pill{font-size:14px}
.sr .kv .more{font-size:12.5px;line-height:1.4;margin-top:3px}
@media (max-width:560px){.rp{padding:16px 14px}.sign{grid-template-columns:1fr;gap:34px}}
@page{margin:12mm}

  body>*:not(main){display:none!important} main{padding:0!important;max-width:none!important}

.top{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

button:hover{border-color:var(--accent)} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

button.ic{padding:3px 8px;font-size:13px;line-height:1.2}

.tabs i.tb{font-style:normal;margin-left:6px;font-size:12px} .tabs i.tb.ok{color:var(--good)} .tabs i.tb.todo{color:var(--warn);font-size:16px;line-height:0}
.tabs button b{font-family:var(--font-num);font-weight:500;font-size:11px;margin-right:6px;opacity:.7}
main{max-width:1180px;margin:0 auto;padding:16px}
.panel{display:none} .panel.on{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}

textarea{font-family:var(--font-num);font-size:12.5px;min-height:150px;resize:vertical}
.tbl input,.tbl select{padding:4px 6px;font-size:13px;min-width:62px} .tbl td{padding:3px 4px;border-bottom:0} .tbl th{padding:3px 6px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:4px;padding:9px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 9px;border-radius:4px;font-size:12px;line-height:1.5;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{font-family:var(--font-num)} .tip i{display:inline-block;width:12px;border-top:2.5px solid;margin-right:6px;vertical-align:middle}

<script>/* Torque & drag engine. Internal units: ft, in, lb, ft-lb, ppg, degrees. Loads in lb (UI shows klbs). */
(function (root) {
  'use strict';
  var E = 30e6, G = 11.5e6, DEG = Math.PI / 180, PI = Math.PI;

  function tvec(inc, azi) { var i = inc * DEG, a = azi * DEG; return [Math.sin(i) * Math.cos(a), Math.sin(i) * Math.sin(a), Math.cos(i)]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function ang(a, b) { return Math.acos(Math.max(-1, Math.min(1, dot(a, b)))); }
  function rf(b) { return b < 1e-4 ? 1 + b * b / 12 : 2 / b * Math.tan(b / 2); }
  function pos(v) { v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; }

  /* ---------- Trajectory: minimum curvature ---------- */
  function buildTraj(rows) {
    var st = (rows || []).map(function (r) { return { md: parseFloat(r.md), inc: parseFloat(r.inc), azi: parseFloat(r.azi) }; })
      .filter(function (r) { return isFinite(r.md) && isFinite(r.inc) && r.md >= 0; });
    st.forEach(function (r) { if (!isFinite(r.azi)) r.azi = 0; });
    st.sort(function (a, b) { return a.md - b.md; });
    st = st.filter(function (r, i) { return i === 0 || r.md > st[i - 1].md + 1e-6; });
    if (!st.length || st[0].md > 1e-6) st.unshift({ md: 0, inc: 0, azi: st.length ? st[0].azi : 0 });
    var tvd = 0, n = 0, e = 0, maxInc = 0, maxDls = 0;
    st.forEach(function (s, i) {
      s.t = tvec(s.inc, s.azi);
      if (i) {
        var p = st[i - 1], dm = s.md - p.md, b = ang(p.t, s.t), k = rf(b) * dm / 2;
        tvd += k * (p.t[2] + s.t[2]); n += k * (p.t[0] + s.t[0]); e += k * (p.t[1] + s.t[1]);
        s.dl = b; s.dls = b / DEG * 100 / dm; maxDls = Math.max(maxDls, s.dls);
      } else { s.dl = 0; s.dls = 0; }
      s.tvd = tvd; s.n = n; s.e = e; maxInc = Math.max(maxInc, s.inc);
    });
    return { st: st, maxInc: maxInc, maxDls: maxDls, td: st[st.length - 1].md };
  }

  function trajAt(tr, md) {
    var st = tr.st, last = st[st.length - 1];
    if (md >= last.md) {
      var d = md - last.md;
      return { md: md, t: last.t, tvd: last.tvd + d * last.t[2], n: last.n + d * last.t[0], e: last.e + d * last.t[1], inc: last.inc, dls: 0 };
    }
    var lo = 0, hi = st.length - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (st[m].md <= md) lo = m; else hi = m; }
    var p = st[lo], q = st[hi], dm = q.md - p.md, f = (md - p.md) / dm, b = q.dl, t;
    if (b < 1e-9) t = p.t;
    else { var s = Math.sin(b), a1 = Math.sin((1 - f) * b) / s, a2 = Math.sin(f * b) / s; t = [a1 * p.t[0] + a2 * q.t[0], a1 * p.t[1] + a2 * q.t[1], a1 * p.t[2] + a2 * q.t[2]]; }
    var k = rf(f * b) * f * dm / 2;
    return { md: md, t: t, tvd: p.tvd + k * (p.t[2] + t[2]), n: p.n + k * (p.t[0] + t[0]), e: p.e + k * (p.t[1] + t[1]),
      inc: Math.acos(Math.max(-1, Math.min(1, t[2]))) / DEG, dls: q.dls };
  }

  /* Planned profile when no survey exists: vertical, build-and-hold (J) or build-hold-drop (S). */
  function profileStations(p) {
    var td = pos(p.td), type = p.type || 'vertical', kop = pos(p.kop), bur = pos(p.bur), inc = pos(p.inc), azi = parseFloat(p.azi) || 0;
    var dropMd = pos(p.dropMd), dor = pos(p.dor), fin = pos(p.finalInc);
    if (type !== 'vertical' && (!bur || !inc)) type = 'vertical';
    var eob = kop + (bur ? inc / bur * 100 : 0);
    if (type === 's' && (!dor || dropMd < eob)) type = 'j';
    var eod = dropMd + (dor ? (inc - fin) / dor * 100 : 0);
    function incAt(md) {
      if (type === 'vertical' || md <= kop) return 0;
      if (md <= eob) return (md - kop) * bur / 100;
      if (type === 'j' || md <= dropMd) return inc;
      if (md <= eod) return inc - (md - dropMd) * dor / 100;
      return fin;
    }
    var marks = [0, td];
    for (var m = 100; m < td; m += 100) marks.push(m);
    [kop, eob, dropMd, eod].forEach(function (x) { if (type !== 'vertical' && x > 0 && x < td) marks.push(x); });
    marks.sort(function (a, b) { return a - b; });
    var out = [];
    marks.forEach(function (md) { if (!out.length || md > out[out.length - 1].md + 1e-6) out.push({ md: md, inc: incAt(md), azi: azi }); });
    return out;
  }

  /* ---------- Wellbore ---------- */
  function holeAt(secs, md) {
    var best = null;
    for (var i = 0; i < secs.length; i++) {
      var s = secs[i];
      if (md >= s.top - 1e-6 && md <= s.bottom + 1e-6 && (!best || s.id < best.id)) best = s;
    }
    if (!best && secs.length) { best = secs[secs.length - 1]; }
    return best;
  }

  /* ---------- String ---------- */
  function compProps(c, fl) {
    var od = pos(c.od), id = Math.min(pos(c.id), od * 0.98);
    var A = PI / 4 * (od * od - id * id), I = PI / 64 * (Math.pow(od, 4) - Math.pow(id, 4));
    var wt = pos(c.wt) || 2.67 * (od * od - id * id);
    var wb = wt * (1 - fl.mwOut / 65.5) + 0.0408 * (fl.mwIn - fl.mwOut) * id * id;
    var wf = c.cls === 'premium' ? 0.8 : 1, odE = id + (od - id) * wf;
    var Ae = PI / 4 * (odE * odE - id * id), Je = PI / 32 * (Math.pow(odE, 4) - Math.pow(id, 4));
    var ym = pos(c.yield), mp = pos(c.maxPull) * 1000, mt = pos(c.maxTorque);
    var tens = ym ? ym * Ae : Infinity; if (mp) tens = Math.min(tens, mp);

  function pathChart(pre, w, h) {
    var tr = R.traj; if (!tr) return '';

    for (var i = 0; i <= N; i++) { var p = TD.trajAt(tr, end * i / N); all.push([dep(p), p.tvd]); }
    if (R.D) { for (i = 0; i <= N; i++) { p = TD.trajAt(tr, R.D * i / N); str.push([dep(p), p.tvd]); } marks.push({ x: str[N][0], y: str[N][1], cls: 's1', label: 'String bottom ' + n0(R.D) + ' ft MD' }); }
    (R.secs || []).forEach(function (s) { if (s.cased && s.bottom < end + 1) { var q = TD.trajAt(tr, s.bottom); marks.push({ x: dep(q), y: q.tvd, cls: 'sn', label: 'Shoe ' + n0(s.bottom) + ' ft', dy: -8 }); } });
    return chart({ id: pre + 'path', w: w, h: h || Math.round(w * 0.7), title: 'Well path', sub: 'Vertical depth against horizontal departure. Not to scale.', xl: 'Horizontal departure (ft)', yl: 'True vertical depth (ft)', down: true, x0: true, y0: true, noHover: true,
      series: [{ name: 'Well path', cls: 'sn', noDot: 1, pts: all }].concat(str.length ? [{ name: 'String in hole', cls: 's1', noDot: 1, pts: str }] : []), marks: marks });
  }

    switch (p[0]) {
      case 'mode': S.traj.mode = p[1]; renderInputs(); calc(); break;
      case 'add-sec': S.secs.push({ name: '', cased: 'cased', top: S.secs.length ? S.secs[S.secs.length - 1].bottom : '0', bottom: '', id: '', mu: '0.25', muSO: '' }); renderInputs(); calc(); break;
      case 'del-sec': S.secs.splice(i, 1); renderInputs(); calc(); break;
      case 'add-comp': S.comps.splice(Math.max(0, S.comps.length - 1), 0, comp({ name: '', type: 'tool' })); renderInputs(); calc(); break;
      case 'del-comp': S.comps.splice(i, 1); renderInputs(); calc(); break;
      case 'up-comp': if (i > 0) { S.comps.splice(i - 1, 0, S.comps.splice(i, 1)[0]); renderInputs(); calc(); } break;
      case 'down-comp': if (i < S.comps.length - 1) { S.comps.splice(i + 1, 0, S.comps.splice(i, 1)[0]); renderInputs(); calc(); } break;
      case 'new-blank': loadCase(baseCase()); showTab('job'); toast('Blank case started.'); break;
      case 'save-case': saveFile(fileName('json'), JSON.stringify(S, null, 1), 'application/json'); break;
      case 'load-case': $('#file-case').click(); break;
      case 'survey-file': $('#file-survey').click(); break;
      case 'dl-report': saveFile(fileName('html'), reportFile(), 'text/html'); break;
      case 'pdf': try { saveFile(fileName('pdf'), buildPDF(S.settings.lang || 'en'), 'application/pdf'); } catch (e) { toast('Could not make the PDF: ' + e.message); } break;
      case 'dl-simple': saveFile(fileName('html').replace('TD_', 'TD_ringkas_'), reportFile(true), 'text/html'); break;
      case 'print-simple': showTab('simple'); document.body.classList.add('ps'); try { window.print(); } catch (e) { toast('Print tidak tersedia di sini. Download report-nya.'); } document.body.classList.remove('ps'); break;
      case 'print': showTab('report'); try { window.print(); } catch (e) { toast('Printing is not available here. Download the report instead.'); } break;
      case 'apply-cal-pu': var k = parseFloat(p[1]); if (k > 0) { S.secs.forEach(function (s) { var so = num(s.muSO); if (!so) s.muSO = ''; s.mu = (num(s.mu) * k).toFixed(3); if (!so) s.muSO = ''; }); renderInputs(); calc(); toast('Pick-up friction factors updated.'); } break;
      case 'apply-cal-so': var k2 = parseFloat(p[1]); if (k2 > 0) { S.secs.forEach(function (s) { s.muSO = ((num(s.muSO) || num(s.mu)) * k2).toFixed(3); }); renderInputs(); calc(); toast('Slack-off friction factors updated.'); } break;
    }
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab]'); if (t) { showTab(t.getAttribute('data-tab')); try { location.hash = t.getAttribute('data-tab'); } catch (e) { /* ignore */ } return; }
    var a = ev.target.closest('[data-act]'); if (a) act(a.getAttribute('data-act'), a);
  });
  function onInput(ev) {
    var el = ev.target, k = el.getAttribute && el.getAttribute('data-k');
    if (el.id === 'cat-comp' && el.value) { var q = el.value.split(':'); S.comps.splice(Math.max(0, S.comps.length - 1), 0, comp(CAT[+q[0]][1][+q[1]])); renderInputs(); calc(); return; }
    if (el.id === 'cat-sec' && el.value) { var c = CATSEC[+el.value], lastB = S.secs.length ? S.secs[S.secs.length - 1].bottom : '0'; S.secs.push({ name: c.name, cased: c.cased, top: lastB || '0', bottom: '', id: String(c.id), mu: String(c.mu), muSO: '' }); renderInputs(); calc(); return; }
    if (!k) return;
    set(S, k, el.value); if (S.example && k.indexOf('job.') !== 0) { /* keep the banner until a blank case is started */ }
    if (el.getAttribute('data-re')) { renderInputs(); calc(); } else schedule();
  }
  document.addEventListener('input', function (ev) { if (ev.target.tagName !== 'SELECT') onInput(ev); });
  document.addEventListener('change', function (ev) { if (ev.target.tagName === 'SELECT') onInput(ev); });
  document.addEventListener('pointermove', onHover); document.addEventListener('pointerdown', onHover);
  document.addEventListener('scroll', hideTip, true);
  $('#file-case').addEventListener('change', function () { readFile(this, function (txt) { try { loadCase(JSON.parse(txt)); toast('Case loaded.'); } catch (e) { toast('That file is not a saved case.'); } }); });
  $('#file-survey').addEventListener('change', function () { readFile(this, function (txt) { var n = parseSurvey(txt).length; if (!n) { toast('No survey stations found in that file.'); return; } S.traj.surveyText = txt; S.traj.mode = 'survey'; renderInputs(); calc(); toast(n + ' stations imported.'); }); });
  window.addEventListener('hashchange', function () { showTab((location.hash || '').replace('#', '')); });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(renderDynamic, 250); });
  window.addEventListener('beforeprint', function () { var r = $('#report'); if (r && !R.error) r.outerHTML = reportHTML(700); var q = $('#simple-report'); if (q && !R.error) q.outerHTML = simpleHTML(700); });
  window.addEventListener('afterprint', function () { renderDynamic(); });

  /* ---------- start ---------- */
  if (Object.keys(BUILTIN).length) $('.top .case').insertAdjacentHTML('afterend', '<select id="builtin" aria-label="Open an example case" style="max-width:260px;font-size:13px"><option value="">Open example: ESTA-6…</option>' + Object.keys(BUILTIN).map(function (k) { return '<option value="' + k + '">' + esc(BUILTIN[k].label) + '</option>'; }).join('') + '</select>');
  if ($('#builtin')) $('#builtin').addEventListener('change', function () { var k = this.value; if (!k) return; loadCase(JSON.parse(JSON.stringify(BUILTIN[k].case))); showTab('results'); toast(BUILTIN[k].label + ' opened.'); this.value = ''; });
  $('#tabs').innerHTML = TABS.map(function (t, i) { return '<button role="tab" data-tab="' + t[0] + '" id="tab-' + t[0] + '"><b>' + (i + 1) + '</b>' + esc(t[1]) + '</button>'; }).join('');
  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
  S = merge(baseCase(), saved && saved.v === 1 && !saved.example ? saved : (BUILTIN.overshot_4235 ? JSON.parse(JSON.stringify(BUILTIN.overshot_4235.case)) : exampleCase())); S.comps = (S.comps || []).map(comp);
  renderInputs(); showTab((location.hash || '').replace('#', '') || 'results'); calc();
})();
</script>
